<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzington: The Hero of Paz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Caprasimo&display=swap" rel="stylesheet">
    <style>
        :root {
            --paz-green: #4ade80;
            --magum-purple: #a855f7;
            --fear-grey: #64748b;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow: hidden;
        }
        .story-heading { font-family: 'Caprasimo', cursive; }
        
        .page-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .spread {
            flex: 0 0 100vh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Push content to bottom */
        }

        .illustration-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
            filter: brightness(0.8); 
            transition: background-image 0.5s ease-in-out;
        }

        .content-overlay {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 5rem auto;
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(15px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
        }

        .fuzz-power {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 1.5rem;
            background: #fbbf24;
            color: #451a03; 
            font-weight: 700;
            border-radius: 1rem;
            margin-top: 1rem;
            animation: slideIn 0.5s ease-out;
            text-align: left;
        }

        .fact-text {
            color: #3b2100;
            font-weight: 600;
            line-height: 1.4;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-btn {
            position: fixed;
            bottom: 1.5rem;
            padding: 0.8rem 2rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-next { right: 1.5rem; background: var(--paz-green); color: #064e3b; box-shadow: 0 4px 14px 0 rgba(74, 222, 128, 0.39); }
        .btn-prev { left: 1.5rem; background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(4px); }
        
        .progress-indicator {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 0.4rem 1rem;
            border-radius: 99px;
            font-weight: bold;
            font-size: 0.85rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.6rem 1rem;
            border-radius: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .option-btn:hover { background: #fbbf24; color: #451a03; border-color: #fbbf24; }
    </style>
</head>
<body>

    <div id="master-container" class="page-container"></div>
    <div id="progress" class="progress-indicator"></div>

    <button id="prevBtn" class="nav-btn btn-prev" onclick="changePage(-1)" style="display:none">Back</button>
    <button id="nextBtn" class="nav-btn btn-next" onclick="changePage(1)">Begin</button>

    <script>
        const story = [
            {
                phase: "The Ordinary World",
                title: "The Guiding Voice",
                text: "Fuzzington was a small, golden wolf cub. In the Kingdom of Paz, he spent his days listening to his father, Heshima. Heshima’s calm stories were a warm blanket of protection for everyone in the valley.",
                image: "images/IMG_7402.png"
            },
            {
                phase: "The Call to Adventure",
                title: "A Sudden Silence",
                text: "One morning, Heshima’s voice was gone. Hofu, the Golden Langur, had taken it, believing control was safer than love. 'Fuzzington,' Heshima whispered weakly, 'the valley needs calm. You must find the Ny-Gumi plant.'",
                image: "images/IMG_7403.png"
            },
            {
                phase: "Crossing the Threshold",
                title: "The First Step",
                text: "Fuzzington reached the Whispering Woods. He didn't feel very brave, and he worried about disappointing his father. But he thought of the quiet safety of Paz and stepped into the purple mist.",
                image: "images/IMG_7404.png"
            },
            {
                phase: "The Trial of Vision",
                title: "Ona's Quiet Light",
                text: "The woods were dark! Ona, the Reindeer, appeared with blue glowing antlers. 'You don’t need to remove the darkness to move forward,' she said. 'Just trust the light you carry.'",
                image: "images/IMG_7405.png",
                question: "What color do Reindeer eyes turn in winter to help them see in the dark?",
                options: ["Blue", "Gold"],
                correct: 0,
                fact: "Reindeer eyes change from gold to blue to capture more light! Like Ona, they find a way through the shadows.",
                power: "Steady Vision! 👁️"
            },
            {
                phase: "The Trial of Heat",
                title: "Jua’s Inner Sun",
                text: "A blizzard began to howl. Jua, the great Polar Bear, sat peacefully in the storm. 'Strength comes from gentleness, little one,' he rumbled. 'Your warmth comes from within.'",
                image: "images/IMG_7406.png",
                question: "What color is a Polar Bear's skin underneath all that white fur?",
                options: ["Pink", "Black"],
                correct: 1,
                fact: "Polar bears have black skin to soak up the sun's warmth. Jua teaches us that true strength is quiet and warm.",
                power: "Gentle Warmth! ☀️"
            },
            {
                phase: "The Trial of Shadows",
                title: "Sabia’s Clever Path",
                text: "Shadow-guards blocked the path! Sabia, the Marble Fox, giggled from the trees. 'Being smart doesn't mean being loud or mean. A clever voice is the kindest one!'",
                image: "images/IMG_7407.png",
                question: "Can a Marble Fox make a giggling sound to distract their enemies?",
                options: ["Yes, they giggle!", "No, they only bark"],
                correct: 0,
                fact: "Foxes can make over 40 sounds, including a giggle! Sabia uses her wit to avoid conflict, just like Fuzzington.",
                power: "Wise Words! 🗣️"
            },
            {
                phase: "The Climax",
                title: "Jasiri’s Respect",
                text: "At the Peak of Magum, Jasiri the Harpy Eagle landed softly. He didn't test Fuzzington’s strength, but his resolve. 'True courage is respectful and steady,' Jasiri declared, offering the plant.",
                image: "images/IMG_7408.png",
                question: "How large can a Harpy Eagle's talons grow?",
                options: ["As big as a Grizzly's claws", "As small as a kitten's"],
                correct: 0,
                fact: "Harpy Eagle talons can be 5 inches long! Jasiri is a stern guardian, but he respects Fuzzington’s quiet bravery.",
                power: "The Ny-Gumi Plant! 🌿"
            },
            {
                phase: "Resolution",
                title: "The Calm Returns",
                text: "Fuzzington found Hofu and offered kindness instead of anger. Seeing she wasn't alone, Hofu released Heshima's voice. The valley was safe again, led by a small cub who learned to trust himself.",
                image: "images/IMG_7409.png"
            }
        ];

        let currentPage = 0;
        const container = document.getElementById('master-container');

        function renderPage() {
            container.innerHTML = '';
            const data = story[currentPage];

            const page = document.createElement('div');
            page.className = 'spread';
            
            const bg = document.createElement('div');
            bg.className = 'illustration-bg';
            bg.style.backgroundImage = `url('${data.image}')`;
            bg.style.backgroundColor = '#1a1a1a';
            
            const content = document.createElement('div');
            content.className = 'content-overlay';
            
            let interactiveHTML = '';
            if (data.question) {
                interactiveHTML = `
                    <div id="quiz-box" class="mt-4 pt-4 border-t border-white/10 flex flex-col md:flex-row md:items-center gap-4">
                        <p class="text-yellow-400 font-bold text-sm md:w-1/3">⭐ Challenge: ${data.question}</p>
                        <div class="flex gap-2 md:w-2/3">
                            ${data.options.map((opt, i) => `
                                <button onclick="handleAnswer(${i})" class="option-btn text-white flex-1">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="flex items-center gap-3 mb-1">
                    <p class="text-[10px] font-black tracking-[0.2em] text-yellow-500 uppercase">${data.phase}</p>
                </div>
                <h1 class="story-heading text-2xl md:text-3xl mb-2 text-white leading-tight">${data.title}</h1>
                <p class="text-sm md:text-base leading-relaxed text-gray-200">${data.text}</p>
                <div id="reward-zone"></div>
                ${interactiveHTML}
            `;

            page.appendChild(bg);
            page.appendChild(content);
            container.appendChild(page);

            document.getElementById('progress').innerText = `${currentPage + 1} / ${story.length}`;
            document.getElementById('prevBtn').style.display = currentPage === 0 ? 'none' : 'block';
            document.getElementById('nextBtn').innerText = currentPage === 0 ? 'Start Quest' : (currentPage === story.length - 1 ? 'Read Again' : 'Next');
            
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = !!data.question;
        }

        window.handleAnswer = function(idx) {
            const data = story[currentPage];
            if (idx === data.correct) {
                document.getElementById('quiz-box').classList.add('hidden');
                const zone = document.getElementById('reward-zone');
                zone.innerHTML = `
                    <div class="fuzz-power">
                        <div class="text-3xl">🎁</div>
                        <div>
                            <div class="text-sm font-black uppercase tracking-wider mb-1">Lesson Learned: ${data.power}</div>
                            <div class="text-xs fact-text">Fuzz Fact: ${data.fact}</div>
                        </div>
                    </div>
                `;
                document.getElementById('nextBtn').disabled = false;
            }
        };

        window.changePage = function(dir) {
            if (currentPage + dir >= 0 && currentPage + dir < story.length) {
                currentPage += dir;
                renderPage();
            } else if (currentPage + dir === story.length) {
                currentPage = 0;
                renderPage();
            }
        };

        renderPage();
    </script>
</body>
</html>
